apiVersion: 1

datasources:
  # Metriken – Standard-Datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Logs – mit Verknuepfung von Log-Zeilen zu Traces (derivedFields)
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          # Extrahiert eine trace_id aus der Log-Zeile und verlinkt sie zu Tempo
          matcherRegex: '"?trace_?[iI]d"?[:=]\s*"?([a-fA-F0-9]+)"?'
          url: '$${__value.raw}'
          datasourceUid: tempo

  # Traces – mit Trace->Log-Korrelation und Node-Graph
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
      lokiSearch:
        datasourceUid: loki
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus

apiVersion: 1

providers:
  # Laedt alle Dashboard-JSONs aus dem Provisioning-Verzeichnis
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true

global:
  scrape_interval: 15s

# Alarm-Regeln. Ohne Alertmanager werden Alarme nicht zugestellt, sind aber
# unter http://localhost:9090/alerts und via /api/v1/alerts sichtbar.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus selbst
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # VM-Host-Hardware (CPU, RAM, Disk, Netz der VM)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Container-Ressourcen-Metriken
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Vom OTel-Collector exponierte Metriken (OTLP-Metrik-Pfad)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Spring-Boot-Backend (Service folgt in Phase 2; Target darf schon down sein)
  - job_name: 'backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']

<div class="confirmation" data-testid="order-confirmation">
  <div class="check">✓</div>
  <h2>{{ i18n.messages().thankYou }}</h2>
  <dl class="details">
    <dt>{{ i18n.messages().orderNumber }}</dt>
    <dd data-testid="order-id">#{{ order().id }}</dd>
    <dt>{{ i18n.messages().status }}</dt>
    <dd data-testid="order-status">{{ i18n.orderStatus(order().status) }}</dd>
    <dt>{{ i18n.messages().total }}</dt>
    <dd data-testid="order-total">{{ order().totalCents | euro }}</dd>
  </dl>
  <button
    type="button"
    class="btn btn-primary"
    data-testid="new-order"
    (click)="newOrder.emit()"
  >
    {{ i18n.messages().newOrder }}
  </button>
</div>

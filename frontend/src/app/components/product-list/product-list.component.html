@if (products().length === 0) {
  <p class="empty" data-testid="products-empty">
    Aktuell sind keine Produkte verfuegbar.
  </p>
} @else {
  <ul class="product-grid" data-testid="product-grid">
    @for (product of products(); track product.id) {
      <li class="product-card" data-testid="product-card">
        <div class="product-head">
          <h3 class="product-name">{{ product.name }}</h3>
          <span class="product-category">{{ product.category }}</span>
        </div>
        <p class="product-description">{{ product.description }}</p>
        <div class="product-foot">
          <span class="product-price">{{ product.priceCents | euro }}</span>
          <button
            type="button"
            class="btn btn-add"
            data-testid="add-to-cart"
            (click)="add.emit(product)"
          >
            In den Warenkorb
          </button>
        </div>
      </li>
    }
  </ul>
}

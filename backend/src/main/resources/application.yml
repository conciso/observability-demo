spring:
  application:
    name: food-order-backend

  datasource:
    # H2 in-memory; DB_CLOSE_DELAY=-1 keeps the schema alive for the whole JVM lifetime.
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # Schema is owned exclusively by Flyway. Hibernate only validates the mapping.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  h2:
    console:
      enabled: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true   # exposes /actuator/health/liveness and /actuator/health/readiness
  metrics:
    distribution:
      # Enables histogram buckets + percentiles for the business value distribution.
      percentiles-histogram:
        order.value.euros: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.example.foodorder: INFO
